<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EverCut Pro - Premium Web Video Editor</title>
    <!-- Google Fonts: Outfit and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-neutral-900 text-white font-sans antialiased">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, {
        useState,
        useRef,
        useEffect,
        useCallback,
      } from "https://esm.sh/react@18.2.0";
      import { createRoot } from "https://esm.sh/react-dom@18.2.0/client";
      import {
        Play,
        Pause,
        SkipBack,
        SkipForward,
        Scissors,
        Trash2,
        Upload,
        Download,
        Settings,
        Layers,
        Music,
        Image as ImageIcon,
        Video,
        Monitor,
        ChevronLeft,
        ChevronRight,
        Activity,
        Volume2,
        ZoomIn,
        ZoomOut,
        Magnet,
        Square,
        Rewind,
        FastForward,
        Minimize2,
        Maximize2,
        VolumeX,
        Anchor,
        HelpCircle,
        Repeat,
        MapPin,
        X,
        TrendingUp,
        TrendingDown,
        FileVideo,
        Copy,
        Clipboard,
        Move,
        Keyboard,
        Undo,
        Redo,
        Folder,
        Plus,
        Eye,
        EyeOff,
        Lock,
        Unlock,
      } from "https://esm.sh/lucide-react@0.292.0";

      const CONFIG = {
        width: 1920,
        height: 1080,
        fps: 30,
        trackHeight: 100,
        headerHeight: 40,
        snapThresholdPx: 15,
        minClipDuration: 0.5,
        waveformSamples: 100,
      };

      const TRACK_ORDER = [
        "text1",
        "video3",
        "video2",
        "video1",
        "audio1",
        "audio2",
      ];

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        const ms = Math.floor((seconds % 1) * 100);
        return `${m.toString().padStart(2, "0")}:${s.toString().padStart(2, "0")}.${ms.toString().padStart(2, "0")}`;
      };

      const generateId = () => Math.random().toString(36).substr(2, 9);

      const getInterpolatedValue = (keyframes, time, defaultValue) => {
        if (!keyframes || keyframes.length === 0) return defaultValue;
        const sorted = [...keyframes].sort((a, b) => a.time - b.time);
        if (time <= sorted[0].time) return sorted[0].value;
        if (time >= sorted[sorted.length - 1].time) return sorted[sorted.length - 1].value;
        for (let i = 0; i < sorted.length - 1; i++) {
          const k1 = sorted[i];
          const k2 = sorted[i + 1];
          if (time >= k1.time && time <= k2.time) {
            const ratio = (time - k1.time) / (k2.time - k1.time);
            return k1.value + ratio * (k2.value - k1.value);
          }
        }
        return defaultValue;
      };

      function WebVideoEditor() {
        const [isPlaying, setIsPlaying] = useState(false);
        const [currentTime, setCurrentTime] = useState(0);
        const [duration, setDuration] = useState(60);
        const [zoomLevel, setZoomLevel] = useState(20);
        const [snapping, setSnapping] = useState(true);
        const [isLooping, setIsLooping] = useState(false);
        const [showHelp, setShowHelp] = useState(false);
        const [exportFormat, setExportFormat] = useState("mp4");
        const [masterVolume, setMasterVolume] = useState(1.0);

        const [tracks, setTracks] = useState({
          text1: [],
          video3: [],
          video2: [],
          video1: [],
          audio1: [],
          audio2: [],
        });
        const [history, setHistory] = useState({ past: [], future: [] });

        const [markers, setMarkers] = useState([]);
        const [selectedClip, setSelectedClip] = useState(null);
        const [clipboard, setClipboard] = useState(null);

        const [draggingClip, setDraggingClip] = useState(null);
        const [draggingLocator, setDraggingLocator] = useState(null);
        const [trimming, setTrimming] = useState(null);

        const [locators, setLocators] = useState({ left: 0, right: 10 });
        const [isRendering, setIsRendering] = useState(false);

        // EverCut Pro state additions
        const [assets, setAssets] = useState([]);
        const [isInspectorOpen, setIsInspectorOpen] = useState(true);
        const [isLibraryOpen, setIsLibraryOpen] = useState(true);
        const [activeSnapTime, setActiveSnapTime] = useState(null);
        const [exportProgress, setExportProgress] = useState(0);
        const [isPreparingExport, setIsPreparingExport] = useState(false);
        const [rippleMode, setRippleMode] = useState(false);

        const canvasRef = useRef(null);
        const previewContainerRef = useRef(null);
        const timelineContainerRef = useRef(null);
        const tracksContainerRef = useRef(null);
        const hiddenMediaContainerRef = useRef(null);
        const meterCanvasRef = useRef(null);

        // FIX: declare the missing preDragState ref that was used but never created.
        const preDragState = useRef(null);

        const videoElementsRef = useRef({});
        const audioElementsRef = useRef({});
        const audioGainNodesRef = useRef({});
        const audioPannerNodesRef = useRef({});
        const canvasStreamRef = useRef(null);
        const requestRef = useRef();
        const mediaRecorderRef = useRef(null);
        const isMounted = useRef(true);

        const stateRef = useRef({
          currentTime: 0,
          isPlaying: false,
          isRendering: false,
          tracks: {
            text1: [],
            video3: [],
            video2: [],
            video1: [],
            audio1: [],
            audio2: [],
          },
          locators: { left: 0, right: 10 },
          duration: 60,
          isLooping: false,
          lastTime: 0,
          masterVolume: 1.0,
          zoomLevel: 20,
          snapping: true,
          markers: [],
          rippleMode: false,
        });

        const audioContextRef = useRef(null);
        const destNodeRef = useRef(null);
        const masterGainRef = useRef(null);
        const analyserRef = useRef(null);
        const analyserLRef = useRef(null);
        const analyserRRef = useRef(null);
        const audioSourcesRef = useRef(new Map());

        // --- Actions ---
        const updateTime = useCallback((newTime) => {
          setCurrentTime(newTime);
          stateRef.current.currentTime = newTime;
          requestAnimationFrame(() => renderFrame(newTime, true));
        }, []);

        const initAudio = () => {
          if (!audioContextRef.current) {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            audioContextRef.current = new AudioContext();

            masterGainRef.current = audioContextRef.current.createGain();
            masterGainRef.current.gain.value = stateRef.current.masterVolume;

            analyserRef.current = audioContextRef.current.createAnalyser();
            analyserRef.current.fftSize = 256;
            masterGainRef.current.connect(analyserRef.current);

            // Channel splitter for stereo VU meter
            const splitter = audioContextRef.current.createChannelSplitter(2);
            masterGainRef.current.connect(splitter);

            analyserLRef.current = audioContextRef.current.createAnalyser();
            analyserLRef.current.fftSize = 256;
            analyserRRef.current = audioContextRef.current.createAnalyser();
            analyserRRef.current.fftSize = 256;

            splitter.connect(analyserLRef.current, 0); // left
            splitter.connect(analyserRRef.current, 1); // right

            analyserRef.current.connect(audioContextRef.current.destination);

            destNodeRef.current =
              audioContextRef.current.createMediaStreamDestination();
            analyserRef.current.connect(destNodeRef.current);
          }
          if (audioContextRef.current.state === "suspended") {
            audioContextRef.current.resume();
          }
        };

        const checkExportReady = () => {
          const activeClips = [];
          ["video1", "video2", "video3"].forEach((trackId) => {
            const clip = stateRef.current.tracks[trackId].find(
              (c) => stateRef.current.locators.left >= c.start && stateRef.current.locators.left < c.start + c.duration
            );
            if (clip && clip.type === "video") {
              activeClips.push(clip);
            }
          });

          const allReady = activeClips.every((clip) => {
            const el = videoElementsRef.current[clip.id];
            return el ? (el.readyState >= 2 && !el.seeking) : true;
          });

          if (allReady) {
            setIsPreparingExport(false);
            startRecordingAfterSync();
          } else {
            requestAnimationFrame(checkExportReady);
          }
        };

        const startRecordingAfterSync = () => {
          setExportProgress(0);
          
          if (!canvasStreamRef.current) {
            canvasStreamRef.current = canvasRef.current.captureStream(CONFIG.fps);
          }
          const stream = canvasStreamRef.current;
          
          const audioTrack = destNodeRef.current?.stream.getAudioTracks()[0];
          if (audioTrack) {
            stream.getAudioTracks().forEach((track) => stream.removeTrack(track));
            stream.addTrack(audioTrack);
          }

          const chunks = [];
          let mimeType = "video/webm; codecs=vp9";
          if (exportFormat === "mp4") {
            if (MediaRecorder.isTypeSupported("video/mp4; codecs=avc1.42E01E")) {
              mimeType = "video/mp4; codecs=avc1.42E01E";
            } else if (MediaRecorder.isTypeSupported("video/mp4")) {
              mimeType = "video/mp4";
            } else {
              alert("MP4 not supported. Exporting WebM.");
              setExportFormat("webm");
            }
          }

          try {
            const recorder = new MediaRecorder(stream, { mimeType });
            recorder.ondataavailable = (e) => {
              if (e.data.size > 0) chunks.push(e.data);
            };
            recorder.onstop = () => {
              if (!stateRef.current.isRendering) {
                return; // Export was cancelled
              }
              const blob = new Blob(chunks, { type: mimeType.split(";")[0] });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              const ext = exportFormat === "mp4" && mimeType.includes("mp4") ? "mp4" : "webm";
              a.download = `render_${Date.now()}.${ext}`;
              a.click();
            };

            mediaRecorderRef.current = recorder;
            recorder.start();
            setIsPlaying(true);
          } catch (e) {
            setIsRendering(false);
            setIsPlaying(false);
            console.error("Export start failed:", e);
            alert("Export failed. Browser error.");
          }
        };

        const handleExport = async () => {
          setExportProgress(0);
          initAudio();
          updateTime(locators.left);
          setIsRendering(true);
          setIsPreparingExport(true);
          
          // Poll seeking status
          requestAnimationFrame(checkExportReady);
        };

        // --- History ---
        const pushHistory = useCallback((newTracks, saveState = null) => {
          setHistory((prev) => {
            const stateToSave = saveState || stateRef.current.tracks;
            const lastPast = prev.past[prev.past.length - 1];
            if (
              lastPast &&
              JSON.stringify(lastPast) === JSON.stringify(stateToSave)
            ) {
              return prev;
            }
            return {
              past: [...prev.past, stateToSave],
              future: [],
            };
          });
          if (newTracks) {
            setTracks(newTracks);
          }
        }, []);

        const undo = useCallback(() => {
          setHistory((prev) => {
            if (prev.past.length === 0) return prev;
            const newPast = [...prev.past];
            const previousState = newPast.pop();
            setTracks(previousState);
            return {
              past: newPast,
              future: [stateRef.current.tracks, ...prev.future],
            };
          });
        }, []);

        const redo = useCallback(() => {
          setHistory((prev) => {
            if (prev.future.length === 0) return prev;
            const newFuture = [...prev.future];
            const nextState = newFuture.shift();
            setTracks(nextState);
            return {
              past: [...prev.past, stateRef.current.tracks],
              future: newFuture,
            };
          });
        }, []);

        // Keep refs in sync
        useEffect(() => {
          stateRef.current.currentTime = currentTime;
          stateRef.current.isPlaying = isPlaying;
          stateRef.current.isRendering = isRendering;
          stateRef.current.tracks = tracks;
          stateRef.current.locators = locators;
          stateRef.current.duration = duration;
          stateRef.current.isLooping = isLooping;
          stateRef.current.masterVolume = masterVolume;
          stateRef.current.zoomLevel = zoomLevel;
          stateRef.current.snapping = snapping;
          stateRef.current.markers = markers;
          stateRef.current.rippleMode = rippleMode;
        }, [
          currentTime,
          isPlaying,
          isRendering,
          tracks,
          locators,
          duration,
          isLooping,
          masterVolume,
          zoomLevel,
          snapping,
          markers,
          rippleMode,
        ]);

        // --- Dynamic Duration Effect ---
        useEffect(() => {
          let maxTime = 60;
          Object.values(tracks)
            .flat()
            .forEach((clip) => {
              const end = clip.start + clip.duration;
              if (end > maxTime) maxTime = end;
            });
          setDuration(Math.ceil(maxTime + 10));
        }, [tracks]);

        const setupAudioConnection = (element, id) => {
          initAudio();
          if (audioSourcesRef.current.has(element)) return;

          try {
            const source =
              audioContextRef.current.createMediaElementSource(element);
            const clipGain = audioContextRef.current.createGain();
            const clipPanner = audioContextRef.current.createStereoPanner();

            source.connect(clipGain);
            clipGain.connect(clipPanner);
            clipPanner.connect(masterGainRef.current);

            audioSourcesRef.current.set(element, source);
            audioGainNodesRef.current[id] = clipGain;
            audioPannerNodesRef.current[id] = clipPanner;
          } catch (e) {
            console.warn("Audio connection warning:", e);
          }
        };

        const extractWaveform = async (url) => {
          try {
            const response = await fetch(url);
            const arrayBuffer = await response.arrayBuffer();
            const audioCtx = new (
              window.AudioContext || window.webkitAudioContext
            )();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const rawData = audioBuffer.getChannelData(0);
            const samples = CONFIG.waveformSamples;
            const blockSize = Math.floor(rawData.length / samples);
            const filteredData = [];

            for (let i = 0; i < samples; i++) {
              let sum = 0;
              for (let j = 0; j < blockSize; j++) {
                sum += Math.abs(rawData[blockSize * i + j]);
              }
              filteredData.push(sum / blockSize);
            }

            const multiplier = Math.max(...filteredData) ** -1;
            return filteredData.map((n) => n * multiplier);
          } catch (error) {
            console.error("Waveform extraction failed:", error);
            return null;
          }
        };

        const peakHoldLRef = useRef({ val: 0, time: 0 });
        const peakHoldRRef = useRef({ val: 0, time: 0 });

        // --- Meter Renderer ---
        const drawMeter = useCallback(() => {
          if (!analyserLRef.current || !analyserRRef.current || !meterCanvasRef.current) return false;

          const canvas = meterCanvasRef.current;
          const ctx = canvas.getContext("2d");
          const width = canvas.width;
          const height = canvas.height;

          const bufferLength = analyserLRef.current.frequencyBinCount;
          const dataL = new Uint8Array(bufferLength);
          const dataR = new Uint8Array(bufferLength);
          analyserLRef.current.getByteFrequencyData(dataL);
          analyserRRef.current.getByteFrequencyData(dataR);

          ctx.fillStyle = "#121214";
          ctx.fillRect(0, 0, width, height);

          // Calculate average values
          let sumL = 0;
          let sumR = 0;
          for (let i = 0; i < bufferLength; i++) {
            sumL += dataL[i];
            sumR += dataR[i];
          }
          const levelL = Math.min(1, (sumL / bufferLength) / 110);
          const levelR = Math.min(1, (sumR / bufferLength) / 110);

          // PERFORMANCE OPTIMIZATION: If paused, levels are 0, and peak holds have fully decayed, skip redraw
          if (!stateRef.current.isPlaying && 
              levelL === 0 && 
              levelR === 0 && 
              peakHoldLRef.current.val === 0 && 
              peakHoldRRef.current.val === 0) {
            return false;
          }

          // Update Peak Holds
          const now = Date.now();
          if (levelL > peakHoldLRef.current.val) {
            peakHoldLRef.current = { val: levelL, time: now };
          } else if (now - peakHoldLRef.current.time > 800) {
            peakHoldLRef.current.val = Math.max(0, peakHoldLRef.current.val - 0.008);
          }

          if (levelR > peakHoldRRef.current.val) {
            peakHoldRRef.current = { val: levelR, time: now };
          } else if (now - peakHoldRRef.current.time > 800) {
            peakHoldRRef.current.val = Math.max(0, peakHoldRRef.current.val - 0.008);
          }

          // Gradients
          const grad = ctx.createLinearGradient(0, height, 0, 0);
          grad.addColorStop(0, "#10b981");    // green
          grad.addColorStop(0.65, "#f59e0b"); // amber
          grad.addColorStop(0.85, "#ef4444"); // red

          const barWidth = (width - 4) / 2;

          // Draw Left Channel
          ctx.fillStyle = "#27272a";
          ctx.fillRect(0, 0, barWidth, height);
          ctx.fillStyle = grad;
          ctx.fillRect(0, height - (levelL * height), barWidth, levelL * height);

          // Draw Right Channel
          ctx.fillStyle = "#27272a";
          ctx.fillRect(barWidth + 4, 0, barWidth, height);
          ctx.fillStyle = grad;
          ctx.fillRect(barWidth + 4, height - (levelR * height), barWidth, levelR * height);

          // Draw Peak Hold Marks
          ctx.fillStyle = "#ef4444";
          if (peakHoldLRef.current.val > 0) {
            ctx.fillRect(0, height - (peakHoldLRef.current.val * height), barWidth, 2);
          }
          if (peakHoldRRef.current.val > 0) {
            ctx.fillRect(barWidth + 4, height - (peakHoldRRef.current.val * height), barWidth, 2);
          }

          // Draw dB Scale ticks
          ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
          ctx.lineWidth = 1;
          ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
          ctx.font = "8px monospace";
          
          const dBs = [0, -6, -12, -20, -30, -40];
          dBs.forEach(db => {
            const val = Math.pow(10, db / 20);
            const y = height - (val * height);
            
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();

            if (db === 0 || db === -12 || db === -30) {
              ctx.fillText(`${db}`, 4, y - 2);
            }
          });
          return true;
        }, []);

        // --- Logic: Snapping ---
        const getSnappedTime = useCallback(
          (proposedTime, excludeClipId = null) => {
            const state = stateRef.current;
            if (!state.snapping) {
              setActiveSnapTime(null);
              return proposedTime;
            }

            let bestSnap = proposedTime;
            let minDistance = CONFIG.snapThresholdPx / state.zoomLevel;
            let didSnap = false;

            if (Math.abs(proposedTime - 0) < minDistance) {
              bestSnap = 0;
              didSnap = true;
            }
            if (Math.abs(proposedTime - state.locators.left) < minDistance) {
              bestSnap = state.locators.left;
              didSnap = true;
            }
            if (Math.abs(proposedTime - state.locators.right) < minDistance) {
              bestSnap = state.locators.right;
              didSnap = true;
            }

            state.markers.forEach((m) => {
              if (Math.abs(proposedTime - m.time) < minDistance) {
                bestSnap = m.time;
                didSnap = true;
              }
            });

            Object.values(state.tracks)
              .flat()
              .forEach((clip) => {
                if (clip.id === excludeClipId) return;
                if (Math.abs(proposedTime - clip.start) < minDistance) {
                  bestSnap = clip.start;
                  didSnap = true;
                }
                const clipEnd = clip.start + clip.duration;
                if (Math.abs(proposedTime - clipEnd) < minDistance) {
                  bestSnap = clipEnd;
                  didSnap = true;
                }
              });

            if (
              excludeClipId &&
              Math.abs(proposedTime - state.currentTime) < minDistance
            ) {
              bestSnap = state.currentTime;
              didSnap = true;
            }

            if (didSnap) {
              setActiveSnapTime(bestSnap);
            } else {
              setActiveSnapTime(null);
            }

            return bestSnap;
          },
          [],
        );

        // --- Core Engine: Render Loop ---
        const renderFrame = useCallback(
          (timeOverride = null, forceSeek = false) => {
            const ctx = canvasRef.current?.getContext("2d");
            if (!ctx) return;

            const currentState = stateRef.current;
            const renderTime = timeOverride ?? currentState.currentTime;
            const isPlaying = currentState.isPlaying;

            if (masterGainRef.current) {
              masterGainRef.current.gain.setTargetAtTime(
                currentState.masterVolume,
                audioContextRef.current.currentTime,
                0.1,
              );
            }

            drawMeter();

            try {
              ctx.fillStyle = "#000000";
              ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);

              const activeClipIds = new Set();

              ["video1", "video2", "video3", "text1"].forEach((trackKey) => {
                const clips = currentState.tracks[trackKey];
                const activeClip = clips.find(
                  (c) =>
                    renderTime >= c.start && renderTime < c.start + c.duration,
                );

                if (activeClip) {
                  activeClipIds.add(activeClip.id);

                  const relativeTime = renderTime - activeClip.start;
                  let fadeOpacity = 1;

                  if (
                    activeClip.fadeInDuration > 0 &&
                    relativeTime < activeClip.fadeInDuration
                  ) {
                    fadeOpacity = relativeTime / activeClip.fadeInDuration;
                  } else if (
                    activeClip.fadeOutDuration > 0 &&
                    relativeTime >
                      activeClip.duration - activeClip.fadeOutDuration
                  ) {
                    fadeOpacity =
                      (activeClip.duration - relativeTime) /
                      activeClip.fadeOutDuration;
                  }
                  fadeOpacity = Math.max(0, Math.min(1, fadeOpacity));

                  const gainNode = audioGainNodesRef.current[activeClip.id];
                  if (gainNode) {
                    const currentVol = getInterpolatedValue(activeClip.volumeKeyframes, relativeTime, activeClip.volume ?? 1);
                    const finalVol = activeClip.muted ? 0 : currentVol * fadeOpacity;
                    gainNode.gain.cancelScheduledValues(0);
                    gainNode.gain.setValueAtTime(
                      finalVol,
                      audioContextRef.current?.currentTime || 0,
                    );
                  }

                  const pannerNode = audioPannerNodesRef.current[activeClip.id];
                  if (pannerNode) {
                    const currentPan = getInterpolatedValue(activeClip.panKeyframes, relativeTime, 0);
                    pannerNode.pan.cancelScheduledValues(0);
                    pannerNode.pan.setValueAtTime(
                      currentPan,
                      audioContextRef.current?.currentTime || 0,
                    );
                  }

                  ctx.save();
                  ctx.globalAlpha = fadeOpacity;

                  // Combined Filter String Builder
                  let filterStr = "none";
                  if (activeClip.filter && activeClip.filter !== "none") {
                    filterStr = activeClip.filter;
                  } else if (
                    activeClip.brightness !== undefined ||
                    activeClip.contrast !== undefined ||
                    activeClip.saturate !== undefined ||
                    activeClip.hueRotate !== undefined ||
                    activeClip.blur !== undefined
                  ) {
                    const b = activeClip.brightness ?? 100;
                    const c = activeClip.contrast ?? 100;
                    const s = activeClip.saturate ?? 100;
                    const h = activeClip.hueRotate ?? 0;
                    const bl = activeClip.blur ?? 0;
                    filterStr = `brightness(${b}%) contrast(${c}%) saturate(${s}%) hue-rotate(${h}deg) blur(${bl}px)`;
                  }

                  if (activeClip.type === "video") {
                    const videoEl = videoElementsRef.current[activeClip.id];
                    if (videoEl) {
                      // Sync HTML5 media element mute state
                      videoEl.muted = activeClip.muted || false;

                      const playbackRate = activeClip.speed || 1;
                      if (videoEl.playbackRate !== playbackRate)
                        videoEl.playbackRate = playbackRate;

                      let sourceTime;
                      if (activeClip.reverse) {
                        sourceTime =
                          (activeClip.sourceDuration || activeClip.duration) -
                          (activeClip.offset + relativeTime * playbackRate);
                      } else {
                        sourceTime =
                          activeClip.offset + relativeTime * playbackRate;
                      }

                      const drift = Math.abs(videoEl.currentTime - sourceTime);

                      if (isPlaying && !activeClip.reverse) {
                        if (videoEl.paused && videoEl.readyState >= 2)
                          videoEl.play().catch(() => {});
                        if (forceSeek || drift > 0.5) {
                          if (
                            Number.isFinite(sourceTime) &&
                            sourceTime >= 0 &&
                            sourceTime <= videoEl.duration
                          ) {
                            videoEl.currentTime = sourceTime;
                          }
                        }
                      } else {
                        if (!videoEl.paused) videoEl.pause();
                        if (drift > 0.05) {
                          if (
                            Number.isFinite(sourceTime) &&
                            sourceTime >= 0 &&
                            sourceTime <= videoEl.duration
                          ) {
                            videoEl.currentTime = sourceTime;
                          }
                        }
                      }

                      if (videoEl.readyState >= 2 && !videoEl.seeking) {
                        if (filterStr !== "none") {
                          ctx.filter = filterStr;
                        }
                        const scale = (activeClip.scale ?? 100) / 100;
                        const clipX = ((activeClip.x !== undefined ? activeClip.x : 50) / 100) * CONFIG.width;
                        const clipY = ((activeClip.y !== undefined ? activeClip.y : 50) / 100) * CONFIG.height;
                        const w = CONFIG.width * scale;
                        const h = CONFIG.height * scale;
                        ctx.drawImage(
                          videoEl,
                          clipX - w / 2,
                          clipY - h / 2,
                          w,
                          h,
                        );
                        ctx.filter = "none";
                      }
                    }
                  } else if (activeClip.type === "image") {
                    const imgEl = videoElementsRef.current[activeClip.id];
                    if (imgEl) {
                      if (filterStr !== "none") {
                        ctx.filter = filterStr;
                      }
                      const scale = (activeClip.scale ?? 100) / 100;
                      const clipX = ((activeClip.x !== undefined ? activeClip.x : 50) / 100) * CONFIG.width;
                      const clipY = ((activeClip.y !== undefined ? activeClip.y : 50) / 100) * CONFIG.height;
                      const w = CONFIG.width * scale;
                      const h = CONFIG.height * scale;
                      ctx.drawImage(
                        imgEl,
                        clipX - w / 2,
                        clipY - h / 2,
                        w,
                        h,
                      );
                      ctx.filter = "none";
                    }
                  } else if (activeClip.type === "text") {
                    const fontFam = activeClip.fontFamily || "Arial";
                    ctx.font = `${activeClip.fontSize || 100}px ${fontFam}`;
                    ctx.fillStyle = activeClip.color || "#ffffff";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    const x =
                      ((activeClip.x !== undefined ? activeClip.x : 50) / 100) *
                      CONFIG.width;
                    const y =
                      ((activeClip.y !== undefined ? activeClip.y : 50) / 100) *
                      CONFIG.height;

                    if (activeClip.textShadow) {
                      ctx.shadowColor = activeClip.textShadowColor || "rgba(0, 0, 0, 0.6)";
                      ctx.shadowBlur = activeClip.textShadowBlur || 8;
                      ctx.shadowOffsetX = 3;
                      ctx.shadowOffsetY = 3;
                    }

                    if (activeClip.textStroke) {
                      ctx.strokeStyle = activeClip.textStrokeColor || "#000000";
                      ctx.lineWidth = activeClip.textStrokeWidth || 6;
                      ctx.strokeText(activeClip.text || "Text", x, y);
                    }

                    ctx.fillText(activeClip.text || "Text", x, y);

                    // Reset shadow settings
                    ctx.shadowColor = "transparent";
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                  }
                  ctx.restore();
                }
              });

              ["audio1", "audio2"].forEach((trackKey) => {
                const clips = currentState.tracks[trackKey];
                const activeClip = clips.find(
                  (c) =>
                    renderTime >= c.start && renderTime < c.start + c.duration,
                );

                if (activeClip) {
                  activeClipIds.add(activeClip.id);
                  const el = audioElementsRef.current[activeClip.id];
                  const gainNode = audioGainNodesRef.current[activeClip.id];

                  if (el && gainNode) {
                    // Sync audio element muted state
                    el.muted = activeClip.muted || false;

                    const playbackRate = activeClip.speed || 1;
                    if (el.playbackRate !== playbackRate)
                      el.playbackRate = playbackRate;

                    const relativeTime = renderTime - activeClip.start;
                    const sourceTime =
                      activeClip.offset + relativeTime * playbackRate;
                    const drift = Math.abs(el.currentTime - sourceTime);

                    if (isPlaying) {
                      if (forceSeek || drift > 0.5) el.currentTime = sourceTime;
                      if (el.paused) el.play().catch((e) => {});
                    } else {
                      if (drift > 0.1) el.currentTime = sourceTime;
                      if (!el.paused) el.pause();

                    let vol = activeClip.muted ? 0 : currentVol;

                      activeClip.fadeInDuration > 0 &&
                      relativeTime < activeClip.fadeInDuration

                    } else if (
                      activeClip.fadeOutDuration > 0 &&
                      relativeTime >
                        activeClip.duration - activeClip.fadeOutDuration

                        (activeClip.duration - relativeTime) /
                        activeClip.fadeOutDuration;
                    }

                    gainNode.gain.cancelScheduledValues(0);
                    gainNode.gain.setValueAtTime(
                      Math.max(0, vol),
                      audioContextRef.current?.currentTime || 0,

                    if (pannerNode) {
                      const currentPan = getInterpolatedValue(activeClip.panKeyframes, relativeTime, 0);
                      pannerNode.pan.cancelScheduledValues(0);
                      pannerNode.pan.setValueAtTime(
                        currentPan,
                        audioContextRef.current?.currentTime || 0,
                      );
                    }
                  }
                }
              });

              Object.keys(videoElementsRef.current).forEach((id) => {
                if (!activeClipIds.has(id)) {
                  const el = videoElementsRef.current[id];
                  if (el && !el.paused) el.pause();
                }
              });
              Object.keys(audioElementsRef.current).forEach((id) => {
                if (!activeClipIds.has(id)) {
                  const el = audioElementsRef.current[id];
                  if (el && !el.paused) el.pause();
                }

            } catch (err) {

            }
          },
          [drawMeter],

        const copyClip = useCallback(() => {
          if (selectedClip) setClipboard(selectedClip);
        }, [selectedClip]);

        const pasteClip = useCallback(() => {
          if (!clipboard) return;
          const newId = generateId();
          const pasteTime = stateRef.current.currentTime;

          const newClip = {
            ...clipboard,
            id: newId,
            start: pasteTime,
          };

          if (clipboard.type === "video") {
            let el = videoElementsRef.current[clipboard.id];
            if (el) {
              el = el.cloneNode(true);
            } else {
              el = document.createElement("video");
              el.src = clipboard.src;
              el.crossOrigin = "anonymous";
              el.preload = "auto";
              el.playsInline = true;
            }
            if (hiddenMediaContainerRef.current)
              hiddenMediaContainerRef.current.appendChild(el);
            setupAudioConnection(el, newId);
            videoElementsRef.current[newId] = el;
          } else if (clipboard.type === "image") {
            let el = videoElementsRef.current[clipboard.id];
            if (!el) {
              el = new Image();
              el.src = clipboard.src;
            }
            videoElementsRef.current[newId] = el;
          } else if (clipboard.type === "audio") {
            let el = audioElementsRef.current[clipboard.id];
            if (el) {
              el = el.cloneNode(true);
            } else {
              el = document.createElement("audio");
              el.src = clipboard.src;
            }
            if (hiddenMediaContainerRef.current)
              hiddenMediaContainerRef.current.appendChild(el);
            setupAudioConnection(el, newId);
            audioElementsRef.current[newId] = el;
          }

          const newTracks = {
            ...stateRef.current.tracks,
            [clipboard.trackId]: [
              ...stateRef.current.tracks[clipboard.trackId],
              newClip,
            ],
          };
          pushHistory(newTracks);

          setSelectedClip({ ...newClip, trackId: clipboard.trackId });
        }, [clipboard, pushHistory]);

        const cleanupClipResources = useCallback((clipId, src) => {
          const cleanElement = (el) => {
            if (!el) return;
            if (audioSourcesRef.current.has(el)) {
              try {
                audioSourcesRef.current.get(el).disconnect();
              } catch (e) {
                /* ignore */
              }
              audioSourcesRef.current.delete(el);
            }
            el.pause();
            el.removeAttribute("src");
            el.load();
            el.remove();
          };

          if (videoElementsRef.current[clipId]) {
            cleanElement(videoElementsRef.current[clipId]);
            delete videoElementsRef.current[clipId];
          }
          if (audioElementsRef.current[clipId]) {
            cleanElement(audioElementsRef.current[clipId]);
            delete audioElementsRef.current[clipId];
          }
          if (audioGainNodesRef.current[clipId]) {
            try {
              audioGainNodesRef.current[clipId].disconnect();
            } catch (e) {
              /* ignore */
            }
            delete audioGainNodesRef.current[clipId];
          }

          if (src && src.startsWith("blob:")) {

        const deleteSelected = useCallback(() => {

            const trackClips = stateRef.current.tracks[currentSelected.trackId];
            let newClips = trackClips.filter((c) => c.id !== currentSelected.id);

            if (rippleMode) {
              const deletedStart = currentSelected.start;
              const deletedDuration = currentSelected.duration;
              newClips = newClips.map((c) => {
                if (c.start > deletedStart) {
                  return { ...c, start: Math.max(0, c.start - deletedDuration) };
                }
                return c;
              });
            }

            const newTracks = {
              ...stateRef.current.tracks,
              [currentSelected.trackId]: newClips,
            };
            pushHistory(newTracks);
            return null;
          });
        }, [cleanupClipResources, pushHistory, rippleMode]);

        const rippleDeleteSelected = useCallback(() => {
          setSelectedClip((currentSelected) => {
            if (!currentSelected) return null;
            cleanupClipResources(currentSelected.id, currentSelected.src);
            const trackClips = stateRef.current.tracks[currentSelected.trackId];
            const deletedStart = currentSelected.start;
            const deletedDuration = currentSelected.duration;

            const newClips = trackClips
              .filter((c) => c.id !== currentSelected.id)
              .map((c) => {
                if (c.start > deletedStart) {
                  return { ...c, start: Math.max(0, c.start - deletedDuration) };
                }
                return c;
              });

              ...stateRef.current.tracks,
              [currentSelected.trackId]: newClips,

            return null;

        }, [cleanupClipResources, pushHistory]);

        useEffect(() => {
          return () => {

              .flat()
              .forEach((c) => {

              });
            uniqueSrcs.forEach((src) => URL.revokeObjectURL(src));

        }, []);

        const updateClipVolume = (newVol) => {
          if (!selectedClip) return;
          const vol = parseFloat(newVol);
          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, volume: vol } : c,
            ),
          };
          pushHistory(newTracks);
          setSelectedClip((prev) => ({ ...prev, volume: vol }));
        };

        const updateFadeProp = (prop, value) => {
          if (!selectedClip) return;
          const val = parseFloat(value);
          if (isNaN(val) || val < 0) return;

          const clip = selectedClip;
          let newPropValue = val;
          if (
            prop === "fadeInDuration" &&
            val + (clip.fadeOutDuration || 0) > clip.duration
          ) {
            newPropValue = clip.duration - (clip.fadeOutDuration || 0);
          } else if (
            prop === "fadeOutDuration" &&
            val + (clip.fadeInDuration || 0) > clip.duration
          ) {
            newPropValue = clip.duration - (clip.fadeInDuration || 0);
          }

          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, [prop]: newPropValue } : c,
            ),
          };
          pushHistory(newTracks);
          setSelectedClip((prev) => ({ ...prev, [prop]: newPropValue }));
        };

        const updateClipSpeed = (newSpeed) => {
          if (!selectedClip) return;
          const speed = parseFloat(newSpeed);
          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, speed: speed } : c,
            ),
          };
          pushHistory(newTracks);
          setSelectedClip((prev) => ({ ...prev, speed: speed }));
        };

        const updateClipFilter = (newFilter) => {
          if (!selectedClip) return;
          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, filter: newFilter } : c,
            ),
          };
          pushHistory(newTracks);
          setSelectedClip((prev) => ({ ...prev, filter: newFilter }));
        };

        const updateTextProp = (prop, value) => {
          if (!selectedClip || selectedClip.type !== "text") return;
          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, [prop]: value } : c,
            ),
          };
          pushHistory(newTracks);
          setSelectedClip((prev) => ({ ...prev, [prop]: value }));
        };

        const cutClip = () => {
          if (!selectedClip) return;
          const curTime = stateRef.current.currentTime;
          if (
            curTime <= selectedClip.start ||
            curTime >= selectedClip.start + selectedClip.duration
          )
            return;
          const splitTime = curTime - selectedClip.start;
          const speed = selectedClip.speed || 1;

          const track = stateRef.current.tracks[selectedClip.trackId];
          const newTrack = track.filter((c) => c.id !== selectedClip.id);
          const firstPart = { ...selectedClip, duration: splitTime };
          const secondPart = {
            ...selectedClip,
            id: generateId(),
            start: curTime,
            duration: selectedClip.duration - splitTime,
            offset: selectedClip.offset + splitTime * speed,
          };
          if (selectedClip.type === "video") {
            const el =
              videoElementsRef.current[selectedClip.id].cloneNode(true);
            if (hiddenMediaContainerRef.current)
              hiddenMediaContainerRef.current.appendChild(el);
            setupAudioConnection(el, secondPart.id);
            videoElementsRef.current[secondPart.id] = el;
          }
          if (audioElementsRef.current[selectedClip.id]) {
            const el =
              audioElementsRef.current[selectedClip.id].cloneNode(true);
            if (hiddenMediaContainerRef.current)
              hiddenMediaContainerRef.current.appendChild(el);
            setupAudioConnection(el, secondPart.id);
            audioElementsRef.current[secondPart.id] = el;
          }

          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: [...newTrack, firstPart, secondPart],
          };
          pushHistory(newTracks);
          setSelectedClip(null);
        };

        const detachAudio = () => {
          if (!selectedClip || selectedClip.type !== "video") return;
          const audioId = generateId();
          const audioClip = {
            ...selectedClip,
            id: audioId,
            type: "audio",
            trackId: "audio1",
            name: `Audio: ${selectedClip.name}`,
          };
          const audioEl = document.createElement("audio");
          audioEl.src = selectedClip.src;
          if (hiddenMediaContainerRef.current)
            hiddenMediaContainerRef.current.appendChild(audioEl);
          setupAudioConnection(audioEl, audioId);

          audioElementsRef.current[audioId] = audioEl;
          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, muted: true } : c,
            ),
            audio1: [...stateRef.current.tracks.audio1, audioClip],
          };
          pushHistory(newTracks);
        };

        const toggleProperty = (prop) => {
          if (!selectedClip) return;
          const newTracks = {
            ...stateRef.current.tracks,
            [selectedClip.trackId]: stateRef.current.tracks[
              selectedClip.trackId
            ].map((c) =>
              c.id === selectedClip.id ? { ...c, [prop]: !c[prop] } : c,
            ),
          };
          pushHistory(newTracks);
          setSelectedClip((prev) => ({ ...prev, [prop]: !prev[prop] }));
        };

          setIsPlaying((prev) => {

            if (nextState) {

            } else {

              renderFrame(stateRef.current.currentTime, true);
              if (audioContextRef.current && audioContextRef.current.state === "running") {
                  audioContextRef.current.suspend();
              }

            return nextState;

        // --- Keyboard Shortcuts ---
        useEffect(() => {

            // Cmd/Ctrl shortcuts

                e.preventDefault();
                copyClip();
                return;

                e.preventDefault();
                pasteClip();
                return;

              if (key === "z" && !e.shiftKey) {
                e.preventDefault();
                undo();
                return;

              if (key === "y" || (key === "z" && e.shiftKey)) {
                e.preventDefault();
                redo();
                return;

                e.preventDefault();
                cutClip();
                return;

                if (!e.repeat) {
                  e.preventDefault();
                  togglePlay();
                }
                break;
              case "j":
                e.preventDefault();
                updateTime(Math.max(0, stateRef.current.currentTime - 5));
                break;
              case "k":
                e.preventDefault();
                if (stateRef.current.isPlaying) togglePlay();
                break;
              case "l":
                e.preventDefault();
                updateTime(Math.min(stateRef.current.duration, stateRef.current.currentTime + 5));
                break;
              case "i":
                e.preventDefault();
                setLocators((p) => ({ ...p, left: stateRef.current.currentTime }));
                break;
              case "o":
                e.preventDefault();
                setLocators((p) => ({ ...p, right: stateRef.current.currentTime }));
                break;

                break;

                e.preventDefault();
                const stepRight = e.shiftKey ? 1.0 : 0.1;
                updateTime(Math.min(stateRef.current.duration, stateRef.current.currentTime + stepRight));

                updateTime(stateRef.current.locators.left);
                break;
              case "2":
                updateTime(stateRef.current.locators.right);
                break;

        // --- Animation Loop ---
        const animate = useCallback(
          (time) => {
            const currentState = stateRef.current;

            if (currentState.isPlaying) {
              if (!currentState.lastTime) currentState.lastTime = time;
              const deltaTime = (time - currentState.lastTime) / 1000;
              currentState.lastTime = time;
              const effectiveDelta = Math.min(deltaTime, 0.1);

              let nextTime = currentState.currentTime + effectiveDelta;
              let forceSeek = false;

              if (
                currentState.isRendering &&
                nextTime >= currentState.locators.right
              ) {
                if (
                  mediaRecorderRef.current &&
                  mediaRecorderRef.current.state === "recording"
                ) {
                  mediaRecorderRef.current.stop();
                }
                setIsPlaying(false);
                setIsRendering(false);
                stateRef.current.isPlaying = false;
                stateRef.current.isRendering = false;
                stateRef.current.lastTime = 0;
                setExportProgress(100);
                return;
              }

              if (
                !currentState.isRendering &&
                currentState.isLooping &&
                currentState.currentTime < currentState.locators.right &&
                nextTime >= currentState.locators.right
              ) {
                nextTime = currentState.locators.left;
                forceSeek = true;
              } else if (
                !currentState.isRendering &&
                nextTime >= currentState.duration
              ) {
                setIsPlaying(false);
                stateRef.current.isPlaying = false;
                stateRef.current.lastTime = 0;
                return;
              }

              if (currentState.isRendering) {
                const totalDuration = currentState.locators.right - currentState.locators.left;
                const elapsed = nextTime - currentState.locators.left;
                const progress = Math.max(0, Math.min(99, (elapsed / (totalDuration || 1)) * 100));
                setExportProgress(progress);
              }

              stateRef.current.currentTime = nextTime;
              renderFrame(nextTime, forceSeek);
              requestRef.current = requestAnimationFrame(animate);
              setCurrentTime(nextTime);

              // Center playhead in timeline during playback
              if (timelineContainerRef.current) {
                const container = timelineContainerRef.current;
                const playheadPx = nextTime * stateRef.current.zoomLevel;
                const headerWidth = 100;
                const viewWidth = container.clientWidth;
                const playheadPos = headerWidth + playheadPx;
                const centerOffset = viewWidth / 2;
                container.scrollLeft = Math.max(0, playheadPos - centerOffset);
              }
            } else {
              currentState.lastTime = 0;
              const needsDecay = drawMeter();
              if (needsDecay) {
                requestRef.current = requestAnimationFrame(animate);
              }
            }
          },
          [renderFrame, drawMeter],
        );

        useEffect(() => {
          requestRef.current = requestAnimationFrame(animate);
          return () => cancelAnimationFrame(requestRef.current);
        }, [animate]);

        useEffect(() => {
          if (isPlaying) {
            cancelAnimationFrame(requestRef.current);
            requestRef.current = requestAnimationFrame(animate);
          }
        }, [isPlaying, animate]);

        useEffect(() => {
          if (!stateRef.current.isPlaying) {
            renderFrame(stateRef.current.currentTime, true);
          }
        }, [tracks, currentTime, renderFrame]);

        // --- FIX: Timeline Wheel Handler (zoom + horizontal scroll) ---
        // Attach AFTER mount so the ref exists, and re-bind if the ref ever changes.
        // Using a layout effect-style attachment with the actual DOM element.
        useEffect(() => {
          const container = timelineContainerRef.current;
          if (!container) return;

          const handleWheel = (e) => {
            // Ctrl/Cmd/Alt + wheel = zoom timeline (and prevent browser page zoom)
            if (e.ctrlKey || e.metaKey || e.altKey) {
              e.preventDefault();
              e.stopPropagation();

              // Anchor zoom around the cursor position so it feels natural
              const rect = container.getBoundingClientRect();
              const cursorX = e.clientX - rect.left;
              const headerWidth = 100;
              const timeAtCursor =
                (container.scrollLeft + cursorX - headerWidth) /
                stateRef.current.zoomLevel;

              setZoomLevel((prev) => {
                const next = Math.min(
                  200,
                  Math.max(1, prev + e.deltaY * -0.05 * Math.max(1, prev / 20)),
                );

                // After zoom changes, adjust scroll so the time under the cursor stays put
                requestAnimationFrame(() => {
                  if (timelineContainerRef.current) {
                    const newScrollLeft =
                      timeAtCursor * next - cursorX + headerWidth;
                    timelineContainerRef.current.scrollLeft = Math.max(
                      0,
                      newScrollLeft,
                    );
                  }
                });

                return next;
              });
              return;
            }

            // Shift + wheel = horizontal scroll
            if (e.shiftKey) {
              e.preventDefault();
              container.scrollLeft += e.deltaY;
              return;
            }

            // Plain wheel: convert horizontal trackpad delta to scrollLeft,
            // let vertical delta scroll naturally (don't preventDefault).
            if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
              // Trackpad horizontal swipe — browser handles this natively,
              // but on some setups it's not, so help it along.
              // Don't preventDefault — let native scroll work too.
            }
            // Vertical: let native overflow-y handle it. No preventDefault.
          };

          container.addEventListener("wheel", handleWheel, { passive: false });
          return () => container.removeEventListener("wheel", handleWheel);
        }, []); // ref is stable; one-time attach is correct

        // --- Handlers ---
        const handleFileImport = (e, type) => {
          const file = e.target.files[0];
          if (!file) return;
          const url = URL.createObjectURL(file);
          const assetId = generateId();

          if (type === "video" || type === "audio") {
            const el = document.createElement(type);
            el.src = url;
            el.crossOrigin = "anonymous";
            el.preload = "auto";
            el.playsInline = true;

            el.onerror = () => {
              alert(`Error loading ${file.name}. The file codec may not be supported by your browser. Supported formats typically include MP4 (H.264/AAC) and WebM (VP8/VP9).`);
            };

            if (hiddenMediaContainerRef.current)
              hiddenMediaContainerRef.current.appendChild(el);
            setupAudioConnection(el, assetId);

            el.onloadedmetadata = () => {
              const newAsset = {
                id: assetId,
                type,
                src: url,
                name: file.name,
                duration: el.duration,
                waveform: null,
              };

              setAssets((prev) => [...prev, newAsset]);
              setIsLibraryOpen(true);

              const newClip = {
                id: assetId,
                type,
                src: url,
                start: stateRef.current.currentTime,
                duration: el.duration,
                sourceDuration: el.duration,
                offset: 0,
                fadeInDuration: 0,
                fadeOutDuration: 0,
                reverse: false,
                muted: false,
                volume: 1.0,
                speed: 1.0,
                filter: "none",
                name: file.name,
                waveform: null,
              };

              if (type === "audio" || type === "video") {
                extractWaveform(url).then((waveform) => {
                  if (!isMounted.current) return;
                  setAssets((prev) =>
                    prev.map((a) => (a.id === assetId ? { ...a, waveform } : a))
                  );
                  setTracks((prev) => {
                    const updatedTracks = { ...prev };
                    const tracksToUpdate = type === "audio" ? ["audio1", "audio2"] : ["video1", "video2", "video3"];
                    tracksToUpdate.forEach((tk) => {
                      updatedTracks[tk] = updatedTracks[tk].map((c) =>
                        c.id === assetId ? { ...c, waveform } : c,
                      );
                    });
                    return updatedTracks;
                  });
                });
              }

              const targetTrack = type === "audio" ? "audio1" : "video1";
              if (type === "audio") audioElementsRef.current[assetId] = el;
              else videoElementsRef.current[assetId] = el;

              const newTracks = {
                ...stateRef.current.tracks,
                [targetTrack]: [
                  ...stateRef.current.tracks[targetTrack],
                  newClip,
                ],
              };
              pushHistory(newTracks);
            };
          } else if (type === "image") {
            const img = new Image();
            img.src = url;
            img.onload = () => {
              const newAsset = {
                id: assetId,
                type,
                src: url,
                name: file.name,
                duration: 5,
                waveform: null,
              };

              setAssets((prev) => [...prev, newAsset]);
              setIsLibraryOpen(true);

              const newClip = {
                id: assetId,
                type,
                src: url,
                start: stateRef.current.currentTime,
                duration: 5,
                offset: 0,
                fadeInDuration: 0,
                fadeOutDuration: 0,
                reverse: false,
                speed: 1.0,
                filter: "none",
                name: file.name,
              };
              videoElementsRef.current[assetId] = img;
              const newTracks = {
                ...stateRef.current.tracks,
                video1: [...stateRef.current.tracks.video1, newClip],

        useEffect(() => {
          const handleMouseMove = (e) => {
            if (draggingLocator) {
              const deltaX = e.clientX - draggingLocator.startX;
              const deltaTime = deltaX / zoomLevel;
              let newTime = Math.max(
                0,
                draggingLocator.originalTime + deltaTime,
              );
              newTime = getSnappedTime(newTime);
              setLocators((prev) => ({
                ...prev,
                [draggingLocator.type]: newTime,

            }

            if (trimming) {
              const deltaX = e.clientX - trimming.startX;
              const deltaTime = deltaX / zoomLevel;

              if (trimming.mode === "fade") {
                if (trimming.side === "left") {
                  let newFade = Math.max(
                    0,
                    trimming.originalFadeIn + deltaTime,
                  );
                  newFade = Math.min(newFade, trimming.originalDuration);
                  setTracks((prev) => ({
                    ...prev,
                    [trimming.trackId]: prev[trimming.trackId].map((c) =>
                      c.id === trimming.id

                  let newDuration = trimming.originalDuration - effectiveDelta;
                  let newOffset = trimming.originalOffset + effectiveDelta;

                  if (newOffset < 0) {
                    newOffset = 0;
                    newStart = trimming.originalStart - trimming.originalOffset;
                    newDuration =
                      trimming.originalDuration + trimming.originalOffset;
                  }
                  if (newDuration < CONFIG.minClipDuration) {
                    newDuration = CONFIG.minClipDuration;
                    newStart =
                      trimming.originalStart +
                      trimming.originalDuration -
                      CONFIG.minClipDuration;
                    newOffset =
                      trimming.originalOffset +
                      trimming.originalDuration -
                      CONFIG.minClipDuration;
                  }

                  setTracks((prev) => ({
                    ...prev,
                    [trimming.trackId]: prev[trimming.trackId].map((c) =>
                      c.id === trimming.id
                        ? {
                            ...c,
                            start: newStart,
                            duration: newDuration,
                            offset: newOffset,
                          }
                        : c,
                    ),
                  }));
                  setSelectedClip((prev) =>
                    prev && prev.id === trimming.id
                      ? {
                          ...prev,
                          start: newStart,
                          duration: newDuration,
                          offset: newOffset,
                        }
                      : prev,
                  );
                } else {
                  let newDuration = trimming.originalDuration + deltaTime;
                  let proposedEnd = trimming.originalStart + newDuration;
                  let snappedEnd = getSnappedTime(proposedEnd, trimming.id);
                  newDuration = snappedEnd - trimming.originalStart;

                  if (newDuration < CONFIG.minClipDuration)
                    newDuration = CONFIG.minClipDuration;
                  if (
                    trimming.originalOffset + newDuration >
                    trimming.sourceDuration
                  )
                    newDuration =
                      trimming.sourceDuration - trimming.originalOffset;

                  setTracks((prev) => ({
                    ...prev,
                    [trimming.trackId]: prev[trimming.trackId].map((c) =>
                      c.id === trimming.id
                        ? { ...c, duration: newDuration }
                        : c,
                    ),
                  }));
                  setSelectedClip((prev) =>
                    prev && prev.id === trimming.id
                      ? { ...prev, duration: newDuration }
                      : prev,
                  );
                }
              }
              return;
            }

            if (draggingClip) {
              const deltaX = e.clientX - draggingClip.startX;
              const deltaTime = deltaX / zoomLevel;
              let newStart = Math.max(
                0,
                draggingClip.originalStart + deltaTime,
              );
              newStart = getSnappedTime(newStart, draggingClip.id);

               const tracksRect =

                   tracksRect.top +

                 if (trackIndex >= 0 && trackIndex < TRACK_ORDER.length) {
                   const newTrackId = TRACK_ORDER[trackIndex];

                     const clip = tracks[draggingClip.trackId].find(
                       (c) => c.id === draggingClip.id,

                         );
                         if (!c) return prev;
                         const newClip = { ...c, start: newStart };
                         return {
                           ...prev,
                           [draggingClip.trackId]: prev[
                             draggingClip.trackId
                           ].filter((x) => x.id !== draggingClip.id),
                           [newTrackId]: [...prev[newTrackId], newClip],
                         };
                       });
                       setDraggingClip((prev) => ({
                         ...prev,
                         trackId: newTrackId,
                       }));
                       setSelectedClip((prev) => ({
                         ...prev,
                         trackId: newTrackId,
                         start: newStart,
                       }));
                       return;
                     }
                   }
                 }
               }

              setTracks((prev) => ({
                ...prev,
                [draggingClip.trackId]: prev[draggingClip.trackId].map((c) =>
                  c.id === draggingClip.id ? { ...c, start: newStart } : c,
                ),
              }));
              setSelectedClip((prev) =>
                prev && prev.id === draggingClip.id
                  ? { ...prev, start: newStart }

                  JSON.stringify(stateRef.current.tracks)

            window.addEventListener("mouseup", handleMouseUp);

          return () => {
            window.removeEventListener("mousemove", handleMouseMove);

        }, [

          trimming,
          getSnappedTime,
