                              value={selectedClip.fadeInDuration || 0}
                              onChange={(e) => updateFadeProp("fadeInDuration", e.target.value)}
                              className="bg-neutral-900 text-white rounded-lg px-3 py-2 outline-none border border-neutral-800 text-xs w-full font-mono"
                            />
                          </div>
                          <div className="flex flex-col gap-1.5 font-sans">
                            <span className="text-[10px] text-neutral-500 font-medium">Fade Out (s)</span>
                            <input
                              type="number"
                              min="0"
                              max={selectedClip.duration - (selectedClip.fadeInDuration || 0)}
                              step="0.1"
                              value={selectedClip.fadeOutDuration || 0}
                              onChange={(e) => updateFadeProp("fadeOutDuration", e.target.value)}
                              className="bg-neutral-900 text-white rounded-lg px-3 py-2 outline-none border border-neutral-800 text-xs w-full font-mono"
                            />
                          </div>
                        </div>

                        {/* Audio automation curves */}
                        <div className="space-y-4 pt-4 border-t border-neutral-900">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-semibold text-white text-[10px] uppercase tracking-wide">Volume Automation</span>
                            <button
                              onClick={() => {
                                const relTime = Math.max(0, stateRef.current.currentTime - selectedClip.start);
                                const currentVal = getInterpolatedValue(selectedClip.volumeKeyframes, relTime, selectedClip.volume ?? 1);
                                const newKeyframes = [
                                  ...(selectedClip.volumeKeyframes || []),
                                  { id: generateId(), time: relTime, value: currentVal }
                                ].sort((a, b) => a.time - b.time);
                                
                                const newTracks = {
                                  ...stateRef.current.tracks,
                                  [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) =>
                                    c.id === selectedClip.id ? { ...c, volumeKeyframes: newKeyframes } : c
                                  ),
                                };
                                pushHistory(newTracks);
                                setSelectedClip((prev) => ({ ...prev, volumeKeyframes: newKeyframes }));
                              }}
                              className="text-[10px] font-semibold text-blue-500 hover:text-blue-400 transition-colors uppercase tracking-wide"
                            >
                              + Add Keyframe
                            </button>
                          </div>
                          
                          {(selectedClip.volumeKeyframes || []).length === 0 ? (
                            <div className="text-[10px] text-neutral-600 italic">No volume keyframes set (using static volume).</div>
                          ) : (
                            <div className="space-y-2 max-h-32 overflow-y-auto pr-1 bg-neutral-950/40 p-2 rounded-lg border border-neutral-850">
                              {(selectedClip.volumeKeyframes || []).map((kf) => (
                                <div key={kf.id} className="flex items-center justify-between gap-2 text-xs">
                                  <span className="font-mono text-[10px] text-neutral-500 w-12">{kf.time.toFixed(2)}s:</span>
                                  <input
                                    type="range"
                                    min="0"
                                    max="1"
                                    step="0.05"
                                    value={kf.value}
                                    onChange={(e) => {
                                      const newKeyframes = selectedClip.volumeKeyframes.map((k) =>
                                        k.id === kf.id ? { ...k, value: parseFloat(e.target.value) } : k
                                      );
                                      const newTracks = {
                                        ...stateRef.current.tracks,
                                        [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) =>
                                          c.id === selectedClip.id ? { ...c, volumeKeyframes: newKeyframes } : c
                                        ),
                                      };
                                      pushHistory(newTracks);
                                      setSelectedClip((prev) => ({ ...prev, volumeKeyframes: newKeyframes }));
                                    }}
                                    className="flex-1 h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                  />
                                  <span className="font-mono text-[9px] text-neutral-400 w-8">{(kf.value * 100).toFixed(0)}%</span>
                                  <button
                                    onClick={() => {
                                      const newKeyframes = selectedClip.volumeKeyframes.filter((k) => k.id !== kf.id);
                                      const newTracks = {
                                        ...stateRef.current.tracks,
                                        [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) =>
                                          c.id === selectedClip.id ? { ...c, volumeKeyframes: newKeyframes } : c
                                        ),
                                      };
                                      pushHistory(newTracks);
                                      setSelectedClip((prev) => ({ ...prev, volumeKeyframes: newKeyframes }));
                                    }}
                                    className="text-neutral-500 hover:text-red-400 p-0.5"
                                  >
                                    <X className="w-3 h-3" />
                                  </button>
                                </div>
                              ))}
                            </div>
                          )}

                          <div className="flex justify-between items-center text-xs pt-2">
                            <span className="font-semibold text-white text-[10px] uppercase tracking-wide">Panning (L/R) Automation</span>
                            <button
                              onClick={() => {
                                const relTime = Math.max(0, stateRef.current.currentTime - selectedClip.start);
                                const currentVal = getInterpolatedValue(selectedClip.panKeyframes, relTime, selectedClip.pan ?? 0);
                                const newKeyframes = [
                                  ...(selectedClip.panKeyframes || []),
                                  { id: generateId(), time: relTime, value: currentVal }
                                ].sort((a, b) => a.time - b.time);
                                
                                const newTracks = {
                                  ...stateRef.current.tracks,
                                  [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) =>
                                    c.id === selectedClip.id ? { ...c, panKeyframes: newKeyframes } : c
                                  ),
                                };
                                pushHistory(newTracks);
                                setSelectedClip((prev) => ({ ...prev, panKeyframes: newKeyframes }));
                              }}
                              className="text-[10px] font-semibold text-blue-500 hover:text-blue-400 transition-colors uppercase tracking-wide"
                            >
                              + Add Keyframe
                            </button>
                          </div>
                          
                          {(selectedClip.panKeyframes || []).length === 0 ? (
                            <div className="text-[10px] text-neutral-600 italic">No panning keyframes set (using center pan).</div>
                          ) : (
                            <div className="space-y-2 max-h-32 overflow-y-auto pr-1 bg-neutral-950/40 p-2 rounded-lg border border-neutral-850">
                              {(selectedClip.panKeyframes || []).map((kf) => (
                                <div key={kf.id} className="flex items-center justify-between gap-2 text-xs">
                                  <span className="font-mono text-[10px] text-neutral-500 w-12">{kf.time.toFixed(2)}s:</span>
                                  <span className="text-[9px] text-neutral-400">L</span>
                                  <input
                                    type="range"
                                    min="-1"
                                    max="1"
                                    step="0.1"
                                    value={kf.value}
                                    onChange={(e) => {
                                      const newKeyframes = selectedClip.panKeyframes.map((k) =>
                                        k.id === kf.id ? { ...k, value: parseFloat(e.target.value) } : k
                                      );
                                      const newTracks = {
                                        ...stateRef.current.tracks,
                                        [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) =>
                                          c.id === selectedClip.id ? { ...c, panKeyframes: newKeyframes } : c
                                        ),
                                      };
                                      pushHistory(newTracks);
                                      setSelectedClip((prev) => ({ ...prev, panKeyframes: newKeyframes }));
                                    }}
                                    className="flex-1 h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                  />
                                  <span className="text-[9px] text-neutral-400">R</span>
                                  <span className="font-mono text-[9px] text-neutral-400 w-8">{kf.value > 0 ? `R${kf.value.toFixed(1)}` : kf.value < 0 ? `L${Math.abs(kf.value).toFixed(1)}` : "C"}</span>
                                  <button
                                    onClick={() => {
                                      const newKeyframes = selectedClip.panKeyframes.filter((k) => k.id !== kf.id);
                                      const newTracks = {
                                        ...stateRef.current.tracks,
                                        [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) =>
                                          c.id === selectedClip.id ? { ...c, panKeyframes: newKeyframes } : c
                                        ),
                                      };
                                      pushHistory(newTracks);
                                      setSelectedClip((prev) => ({ ...prev, panKeyframes: newKeyframes }));
                                    }}
                                    className="text-neutral-500 hover:text-red-400 p-0.5"
                                  >
                                    <X className="w-3 h-3" />
                                  </button>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {/* Transform Inspector UI */}
                    {(selectedClip.type === "video" || selectedClip.type === "image") && (
                      <div className="space-y-4 pt-4 border-t border-neutral-900">
                        <div className="flex items-center justify-between pb-1 border-b border-neutral-850">
                          <span className="font-semibold text-white text-xs uppercase tracking-wide">Transform</span>
                          <button
                            onClick={() => {
                              const newTracks = {
                                ...stateRef.current.tracks,
                                [selectedClip.trackId]: stateRef.current.tracks[selectedClip.trackId].map((c) => {
                                  if (c.id !== selectedClip.id) return c;
                                  const updated = { ...c };
                                  delete updated.scale;
                                  delete updated.x;
                                  delete updated.y;
                                  return updated;
                                }),
                              };
                              pushHistory(newTracks);
                              setSelectedClip((prev) => {
                                const updated = { ...prev };
                                delete updated.scale;
                                delete updated.x;
                                delete updated.y;
                                return updated;
                              });
                            }}
                            className="text-[10px] font-semibold text-blue-500 hover:text-blue-400 transition-colors uppercase tracking-wide"
                          >
                            Reset
                          </button>
                        </div>

                        {/* Scale */}
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-[10px] text-neutral-500 font-sans">
                            <span>Scale</span>
                            <span className="font-mono text-neutral-400">{selectedClip.scale ?? 100}%</span>
                          </div>
                          <input
                            type="range"
                            min="10"
                            max="200"
                            value={selectedClip.scale ?? 100}
                            onChange={(e) => updateClipFilterVal("scale", e.target.value)}
                            className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                          />
                        </div>

                        {/* Position X and Y */}
                        <div className="grid grid-cols-2 gap-4">
                          <div className="flex flex-col gap-1.5 font-sans">
                            <span className="text-[10px] text-neutral-500 font-medium">Position X (%)</span>
                            <input
                              type="number"
                              value={selectedClip.x !== undefined ? selectedClip.x : 50}
                              onChange={(e) => updateClipFilterVal("x", e.target.value)}
                              className="bg-neutral-900 text-white rounded-lg px-3 py-2 outline-none border border-neutral-800 text-xs w-full font-mono"
                              min="0"
                              max="100"
                            />
                          </div>
                          <div className="flex flex-col gap-1.5 font-sans">
                            <span className="text-[10px] text-neutral-500 font-medium">Position Y (%)</span>
                            <input
                              type="number"
                              value={selectedClip.y !== undefined ? selectedClip.y : 50}
                              onChange={(e) => updateClipFilterVal("y", e.target.value)}
                              className="bg-neutral-900 text-white rounded-lg px-3 py-2 outline-none border border-neutral-800 text-xs w-full font-mono"
                              min="0"
                              max="100"
                            />
                          </div>
                        </div>
                      </div>
                    )}

                    {/* CSS Adjustments / Visual Filters */}
                    {(selectedClip.type === "video" || selectedClip.type === "image") && (
                      <div className="space-y-4 pt-4 border-t border-neutral-900">
                        <div className="flex items-center justify-between pb-1 border-b border-neutral-850">
                          <span className="font-semibold text-white text-xs uppercase tracking-wide">Visual Filters</span>
                          <button
                            onClick={resetClipFilters}
                            className="text-[10px] font-semibold text-blue-500 hover:text-blue-400 transition-colors uppercase tracking-wide"
                          >
                            Reset
                          </button>
                        </div>

                        {/* Brightness */}
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-[10px] text-neutral-500 font-sans">
                            <span>Brightness</span>
                            <span className="font-mono text-neutral-400">{selectedClip.brightness ?? 100}%</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="200"
                            value={selectedClip.brightness ?? 100}
                            onChange={(e) => updateClipFilterVal("brightness", e.target.value)}
                            className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                          />
                        </div>

                        {/* Contrast */}
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-[10px] text-neutral-500 font-sans">
                            <span>Contrast</span>
                            <span className="font-mono text-neutral-400">{selectedClip.contrast ?? 100}%</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="200"
                            value={selectedClip.contrast ?? 100}
                            onChange={(e) => updateClipFilterVal("contrast", e.target.value)}
                            className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                          />
                        </div>

                        {/* Saturation */}
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-[10px] text-neutral-500 font-sans">
                            <span>Saturation</span>
                            <span className="font-mono text-neutral-400">{selectedClip.saturate ?? 100}%</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="200"
                            value={selectedClip.saturate ?? 100}
                            onChange={(e) => updateClipFilterVal("saturate", e.target.value)}
                            className="w-full h-1 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                          />
                        </div>

                        {/* Hue Rotate */}
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-[10px] text-neutral-500 font-sans">
                            <span>Hue Rotate</span>
                            <span className="font-mono text-neutral-400">{selectedClip.hueRotate ?? 0}°</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="360"
                            value={selectedClip.hueRotate ?? 0}
                            onChange={(e) => updateClipFilterVal("hueRotate", e.target.value)}
                            className="w-full h-1 bg-neutral-850 rounded-lg appearance-none cursor-pointer accent-blue-500"
                          />
                        </div>

                        {/* Blur */}
                        <div className="space-y-1.5">
                          <div className="flex justify-between text-[10px] text-neutral-500 font-sans">
                            <span>Blur Radius</span>
                            <span className="font-mono text-neutral-400">{selectedClip.blur ?? 0}px</span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="20"
                            value={selectedClip.blur ?? 0}
                            onChange={(e) => updateClipFilterVal("blur", e.target.value)}
                            className="w-full h-1 bg-neutral-850 rounded-lg appearance-none cursor-pointer accent-blue-500"
                          />
                        </div>
                      </div>
                    )}

                  </div>
                </div>
              )}
            </div>

            <style>{`
              /* Slate scrollbar styles (Standard) */
              * {
                scrollbar-color: #27272a #08080a;
                scrollbar-width: thin;
              }

              /* Legacy fallback for WebKit/Blink browsers */
              @supports not (scrollbar-color: auto) {
                ::-webkit-scrollbar {
                  height: 8px;
                  width: 8px;
                }
                ::-webkit-scrollbar-track {
                  background: #08080a;
                }
                ::-webkit-scrollbar-thumb {
                  background: #27272a;
                  border-radius: 9999px;
                }
                ::-webkit-scrollbar-thumb:hover {
                  background: #3f3f46;
                }
              }

              /* Custom track container styles */
              [ref="tracksContainerRef"] {
                overflow-x: hidden;
              }
            `}</style>
          </div>
        );
      }

      const root = createRoot(document.getElementById("root"));
      root.render(<WebVideoEditor />);
    </script>
  </body>
</html>
